name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commits of releases at least a week old (same rule as npm packages).
env:
  TEST_DATABASE_URL: postgres://finanz:finanz_ci@localhost:5432/finanz_test

jobs:
  check:
    name: Lint, types, boundaries, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: finanz
          POSTGRES_PASSWORD: finanz_ci
          POSTGRES_DB: finanz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U finanz -d finanz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply the migrations to an empty database
        run: AUTH_SECRET="$(openssl rand -base64 32)" pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          APP_URL: http://localhost:5173
      - run: pnpm check
      - name: Build the deployment (web app and bundled API)
        run: node scripts/vercel-build.mjs

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: finanz
          POSTGRES_PASSWORD: finanz_ci
          POSTGRES_DB: finanz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U finanz -d finanz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @finanz/e2e exec playwright install --with-deps chromium
      # Hosted environments run the API as a login that can change rows but not the schema.
      - name: Create the API's limited login
        run: psql "$TEST_DATABASE_URL" -c "create role finanz_app login password 'finanz_app_ci'"
      - run: pnpm e2e
        env:
          E2E_APP_DATABASE_URL: postgres://finanz_app:finanz_app_ci@localhost:5432/finanz_test
      # Traces and the API log (test accounts only) to debug a failure.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-output
          path: e2e/.output/
          retention-days: 7
